apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://github.com/Jozeph555/goit-argo.git
    targetRevision: main
    path: namespaces
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true